

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>arejeKota - Register your restaurant</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <a href="index.html" class="wordmark signup-wordmark">
        <span>areje</span><span class="wordmark-accent">Kota</span>
    </a>

    <div class="signup-card">
        <h1>Register your restaurant</h1>

        <form id="registerRestaurantForm">
            <label for="firstName">First name</label>
            <input type="text" id="firstName" name="firstName" required>

            <label for="lastName">Last name</label>
            <input type="text" id="lastName" name="lastName" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
            
            <label for="cellphone">Cell Phone</label>
            <input type="cellphone"id="cellphone" name="cellphone" required>

            <label for="businessName">Business name</label>
            <input type="text" id="businessName" name="businessName" required>

            <label for="address">Business address</label>
            <input type="text" id="address" name="address" required>

            <button type="submit" class="submit-btn">Submit application</button>
        </form>

        <p class="login-hint">Already approved? <a href="login.html">Log in</a></p>
    </div>

</body>
</html>
