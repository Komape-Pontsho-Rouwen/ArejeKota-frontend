<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset ="UTF-8">
    <meta name ="viewport" content ="width=device-width,initial-scale=1.0">
    <title>arejeKota - Log in</title>
    <link rel ="stylesheet" href ="css/styles.css">

  </head>
  <body>
    <a href="index.html" class="wordmark signup-wordmark">
      <span>areje</span><span class="wordmark-accent">kota</span>
    </a>
    <div class="signup-card">
      <h1>Log in to arejeKota</h1>


      <form>
        <label for="email">Email</label>
        <input type="text" id="email" name="email" placeholder="you@email.com">

        <label for="password">Password</label>
        <input type="text" id="password" name="password" placeholder="Your password">

        <button type="submit" class="submit-btn">Log in</button>

        <p class="login-hint">Dont have an account?<a href="signup.html">Sign up</a></p>
      </form>

    </div>
  </body>
</html>
