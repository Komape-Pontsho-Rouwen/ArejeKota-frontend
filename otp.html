<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset ="UTF-8">
    <meta name ="viewport" content ="width=device-width,initial-scale=1.0">
    <title>arejeKota - Verify your email</title>
    <link rel ="stylesheet" href ="css/styles.css">
  </head>

  <body>

    <a href="index.html"class="wordmark signup-wordmark">
      <span>areje</span><span class="wordmark-accent">Kota</span>
    </a>
    <div class="signup-card">
      <h1>Verify your email</h1>
      <p class="otp-subtext">We sent  a 6-digit code to your email.Enter it below</p>

      <div class="otp-inputs">
        <input type="text" maxlength="1" class="otp-box">
        <input type="text" maxlength="1" class="otp-box">
        <input type="text" maxlength="1" class="otp-box">
        <input type="text" maxlength="1" class="otp-box">
        <input type="text" maxlength="1" class="otp-box">
        <input type="text" maxlength="1" class="otp-box">
      </div>


      <p class="otp-timer">Code expires in<span id="countdown">10:00</span></p>
      <button type="submit" class="submit-btn">Verify</button>
      <p class="login-hint">Didn't get a code?<a href="#" id="resendLink">Resend</a></p>

    </div>
    
    <script src="js/script.js"></script>


  </body>
</html>
