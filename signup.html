<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset ="UTF-8">
    <meta name ="viewport" content ="width=device-width,initial-scale=1.0">
    <title>arejeKota Sign-up</title>
    <link rel ="stylesheet" href ="css/styles.css">
  </head>

  <body>
    <a href="index.html"class="wordmark signup-wordmark">
      <span>areje</span><span class="wordmark-accent">Kota</span>
    </a>
    <div class="signup-card">
      <h1>Create your account</h1>

      <form>
        <label for="firstName">First name</label>
        <input type="text" id="firstName" name="FirstName" placeholder="Anathi">

        <label for="lastName">Last name</label>
        <input type="text" id="lastName" name="LastName" placeholder="Biyela">

        <label for="email">Email</label>
        <input type="text" id="email" name="email" placeholder="you@email.com">

        <label for="password">Password</label>
        <input type="text" id="password" name="password"placeholder="At least 8 characters">
        

        <label for="confirmPassword">Confirm password</label>
        <input type ="text" id="cofirmPassword" name="confirmPassword" placeholder="Re-enter your password">
        
        <button type="submit"class="submit-btn">Sign Up</button>

      </form>

      <p class="login-hint">Already have an account? <a href="login.html">Log in</a></p>

    </div>
  </body>

</html>
